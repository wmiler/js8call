        cd ~/appimage/
        tar zcf /__w/js8call/js8call/js8call_2.3.2-devel_fedora-42-aarch64-ci.tar.gz js8call-aarch64.AppImage
      continue-on-error: true
        
    - name: Create Release and Upload Assets
