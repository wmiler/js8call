        EXEC_PATH=$(find AppDir -type f -name "js8call" -executable | head -1) && \
          echo "Found executable at: $EXEC_PATH" && \
          ~/js8call/build/linuxdeploy/usr/bin/linuxdeploy --appdir AppDir \
          --executable "$EXEC_PATH" \
          --plugin qt \
          --output appimage \
          --desktop-file AppDir/usr/share/applications/js8call.desktop \
          --icon-file AppDir/usr/share/icons/hicolor/128x128/apps/js8call_icon.png
      continue-on-error: true
        
    - name: Upload AppImage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: js8call_2.3.2-devel_x86_64_fedora-42.AppImage
        path: ~/appimage/js8call-x86_64.AppImage
      continue-on-error: true
        
    - name: Create GitHub Release and get short commit SHA
      id: get_sha
      run: |
        echo "short_sha=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT
        
    - name: Create zip file to upload to release page (fedora-42-x86_64)
      run: |
        cd ~/appimage/
        tar zcf /__w/js8call/js8call/js8call_2.3.2-devel_fed42-x86_64-ci.tar.gz js8call-x86_64.AppImage
      continue-on-error: true
        
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2.3.2
      with:
        tag_name: js8call_2.3.2-devel_fedora-42-x86_64-ci
        name: "JS8Call v2.3.2-devel Fedora 42 x86_64 CI AppImage build"
        body: |
          Release created automatically from commit ${{ steps.get_sha.outputs.short_sha }}.
          This AppImage release is from the Fedora 42 x86_64 CI build for JS8Call. Use at your own risk!
        files: /__w/js8call/js8call/js8call_2.3.2-devel_fed42-x86_64-ci.tar.gz
      env:
