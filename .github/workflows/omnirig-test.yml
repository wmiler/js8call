name: Install OmniRig
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v4

    # This step downloads and runs the OmniRig installer silently.
    - name: Download and install OmniRig
      run: |
        $omnirig_zip_url = "http://www.dxatlas.com/OmniRig/Files/OmniRig.zip"
        $install_dir = "$env:TEMP\OmniRigInstaller"
        
        # Download the ZIP file
        Invoke-WebRequest -Uri $omnirig_zip_url -OutFile "$env:TEMP\OmniRig.zip"
        
        # Expand the ZIP file and run the setup
        Expand-Archive "$env:TEMP\OmniRig.zip" -DestinationPath $install_dir -Force
        
        # Use 7z to run the installer silently
        # This prevents the setup wizard from opening
        & "C:\Program Files\7-Zip\7z.exe" x "$install_dir\OmniRigSetup.exe" -o"$env:ProgramFiles(x86)\Afreet\OmniRig" -y
      shell: pwsh
      
    - name: Verify OmniRig installation
      run: Test-Path -Path "$env:ProgramFiles(x86)\Afreet\OmniRig\OmniRig.exe"
      shell: pwsh
