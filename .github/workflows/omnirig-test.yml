name: Install OmniRig

on: [push]

jobs:
  install-omnirig:
    runs-on: windows-2025
    steps:
      - name: Download OmniRig
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://dxatlas.com/OmniRig/Files/OmniRig.zip" -OutFile "OmniRig_Setup.zip"
          Expand-Archive -Path "OmniRig_Setup.zip"

      - name: Install OmniRig
        shell: powershell
        run: |
          Start-Process -FilePath "OmniRigSetup.exe" -ArgumentList "/S" -Wait

      - name: Verify OmniRig Installation (Optional)
        shell: powershell
        run: |
          Get-Item "C:\Program Files (x86)\Afreet\OmniRig\OmniRig.exe"
