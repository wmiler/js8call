permissions:
  contents: read

name: CI Build for Linux x86_64 and Arm64

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release
  build_package: build-essential git cmake libusb-1.0-0-dev libxkbcommon-dev libudev-dev
  ffmpeg_package: ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libpulse-dev
  opengl_package1: libegl1-mesa-dev libgles2-mesa-dev libgbm-dev libgl1-mesa-dev libxkbcommon-x11-dev 
  opengl_package2: libxcb-keysyms1-dev libxcb-image0-dev libxcb-icccm4-dev libxcb-render-util0-dev 
  opengl_package3: libxcb-xfixes0-dev libxcb-sync1-dev libxcb-randr0-dev libxrender-dev

#  appimg_package: libfuse2 imagemagick
#  qt_package: qt6-base-dev qt6-multimedia-dev qt6-serialport-dev
#  misc_package: libhamlib-dev libfftw3-dev libboost-all-dev 


jobs:
  build_amd64_2404:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Install dependencies (ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ env.build_package }} ${{ env.ffmpeg_package }} ${{ env.opengl_package1 }} ${{ env.opengl_package2 }} ${{ env.opengl_package3 }}
        ffmpeg -encoders
        ffmpeg -decoders

# For CI, these should really already be built somewhere
    - name: Install Hamlib
      id: install-hamlib
      run: |
        git clone https://github.com/Hamlib/Hamlib.git ~/hamlib
        cd ~/hamlib
        git checkout 4.6.4
        ./bootstrap
        ./configure --prefix=${GITHUB_WORKSPACE}/local
        make -j 4
        sudo make install-strip
        sudo ldconfig
 
    - name: Install fftw 3.3.10
      id: install-fftw
      run: |
        curl --location --output ./fftw-3.3.10.tar.gz https://www.fftw.org/fftw-3.3.10.tar.gz
        tar zxf fftw-3.3.10.tar.gz
        cd fftw-3.3.10
        ./configure --prefix=${GITHUB_WORKSPACE}/local
        make
        sudo make install
    
    - name: Install Boost 1.88
      id: install-boost
      run: |
        curl --location --output ./boost-1.88.0.tar.gz https://archives.boost.io/release/1.88.0/source/boost_1_88_0.tar.gz
        tar zxf boost-1.88.0.tar.gz
        cd boost_1_88_0
        ./bootstrap.sh --prefix=${GITHUB_WORKSPACE}/local
        sudo ./b2 install
          
    - name: Install QT 6.8.3
      id: install-qt683
      run: |
        git clone https://github.com/qt/qt5.git qt6
        cd qt6
        git switch 6.8.3
        mkdir -p qt6/build
        cd qt6/build
        ls -l ..
        ${GITHUB_WORKSPACE}/qt6/configure --prefix=${GITHUB_WORKSPACE}/qt683-install -init-submodules -submodules qtmultimedia,qtserialport
        cat ${GITHUB_WORKSPACE}/qt6/build/config.summary
        cmake --build .
        cmake --install .

    - name: Check disk space
      run: df -h /
      
    - name: Build JS8Call 
      run: |
        pwd
        mkdir -p build && cd build
        cmake -DCMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/qt683-install -DCMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/local ..
        make -j 4
